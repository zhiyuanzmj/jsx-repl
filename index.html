<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" />
    <title>JSX Playground</title>
    <style>
      body {
        margin: 0;
      }
      #app {
        height: 100vh;
        height: 100dvh;
      }
    </style>

    <!--
      Workaround for the oxc/wasm based vue-jsx compiler loaded from esm.sh.

      - `@vue-jsx/compiler` imports `@vue-jsx/compiler-wasm32-wasi` without
        declaring it as a dependency, so esm.sh resolves it to *latest* instead
        of the version that matches `vue-jsx`. The override pins it to the same
        version as the vue-jsx presets — keep this in sync when bumping
        `vue-jsx` in `src/presets/*/package.json` / the pnpm catalog.
      - `@napi-rs/wasm-runtime@1.2.6` pulls `@emnapi/core@2.0.0-beta.2`, which
        breaks the generated wasm glue ("Cannot set properties of undefined
        (setting 'initWorker')" / "Check exception status failed" panic). Pin it
        back to 1.2.5 + the @emnapi versions the glue was built against.

      Remove once upstream declares the dependency and the @emnapi regression is
      fixed (then also drop the deps pin if no longer needed).
    -->
    <script type="importmap">
      {
        "imports": {
          "https://esm.sh/@vue-jsx/compiler-wasm32-wasi?target=es2022": "https://esm.sh/@vue-jsx/compiler-wasm32-wasi?deps=@napi-rs/wasm-runtime@1.2.5,@emnapi/core@2.0.0-alpha.4,@emnapi/runtime@2.0.0-alpha.4"
        }
      }
    </script>
    <script type="module" src="./test/main.tsx"></script>

    <script>
      window.va =
        window.va ||
        function () {
          ;(window.vaq = window.vaq || []).push(arguments)
        }
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
